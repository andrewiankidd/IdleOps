name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Per-ref: a newer push supersedes an in-flight run rather than stacking matrix
# builds behind it. Matches the release workflows in TWANGA and POSEIDON.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Windows builds and tests the FULL solution (all tools, including the
  # Windows-only ones: inpctl/uiactl/txtfnd/scrcap/imgfnd/waitfr/stpcap/playbk).
  windows:
    name: Windows (full)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore IdleOps.sln

      - name: Build
        run: dotnet build IdleOps.sln --configuration Release --no-restore

      - name: Test (excluding hardware-dependent tests)
        run: |
          dotnet test IdleOps.sln `
            --configuration Release `
            --no-build `
            --filter "FullyQualifiedName!~RecordingTests&FullyQualifiedName!~PlaybkTests.PlaybkTests&FullyQualifiedName!~IntegrationTests" `
            --logger "console;verbosity=normal"

      - name: Smoke test — run .idleops.yaml via playbk
        run: |
          src/playbk/bin/Release/net10.0-windows10.0.22621.0/playbk.exe `
            -i src/playbk/inputs/smoke-test.idleops.yaml `
            -o ./smoke-outputs

      # Windows is the only platform that ships every tool, so its bundle is the
      # complete set — the multi-targeted ones publish their Windows TFM here.
      # One self-contained .exe per tool (PublishSingleFile), so the bundle is a folder of
      # runnable exes rather than hundreds of loose DLLs.
      - name: Publish downloadable binaries
        run: |
          $sf = '-p:PublishSingleFile=true', '-p:DebugType=none'
          foreach ($p in @('cnvrtr','audcap','vidcap','outcap','inpctl','scrcap','imgfnd','llmctl','uiactl','stpcap')) {
            dotnet publish "src/$p/$p.csproj" -c Release -r win-x64 @sf -o "staged/$p"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          foreach ($p in @('spkbak','txtfnd','waitfr','playbk')) {
            dotnet publish "src/$p/$p.csproj" -c Release -f net10.0-windows10.0.22621.0 -r win-x64 @sf -o "staged/$p"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          # Flatten to ONE directory of purpose-named executables. Each tool is published
          # into its own staging dir first, then only its own .exe is taken forward — the
          # staging dirs also contain bare apphosts for ProjectReferenced tools (outcap
          # carries audcap/vidcap, playbk carries most of them) which are dead weight now
          # that each tool is a single file, and would shadow the real binaries.
          #
          # Flat is also what makes playbk work: it prepends its own directory to PATH
          # (Program.cs) and shells out by bare name, so one directory means no duplicated
          # copy of every tool inside playbk's own folder.
          New-Item -ItemType Directory -Force -Path bundle | Out-Null
          Get-ChildItem staged -Directory | ForEach-Object {
            $exe = Join-Path $_.FullName "$($_.Name).exe"
            if (Test-Path $exe) { Copy-Item $exe bundle/ -Force }
            # LLamaSharp's native libraries are the one unavoidable extra.
            $rt = Join-Path $_.FullName 'runtimes'
            if (Test-Path $rt) { Copy-Item $rt bundle/ -Recurse -Force }
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: idleops-win-x64
          path: bundle/

  # Linux/macOS build, test and publish the cross-platform tools. Input (inpctl),
  # screen capture (scrcap), image matching (imgfnd) and the AI layer (llmctl) now
  # run here via platform backends (xdotool/import on Linux) alongside the media
  # tools. The remaining Windows-only tools (uiactl/txtfnd/waitfr/stpcap/playbk) use
  # Win32/COM/WinRT or a Windows-only TFM and stay excluded. See README.md matrix.
  crossplatform:
    name: Cross-platform (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    env:
      # Unattended apt, used by every install below.
      #   DEBIAN_FRONTEND/NEEDRESTART_* — a debconf or needrestart prompt on a runner
      #     with no tty blocks forever rather than failing.
      #   DPkg::Lock::Timeout — apt waits on the dpkg lock *indefinitely* by default, so
      #     an unattended-upgrades run holding it wedges the job until the 6h ceiling.
      #     Bounded, it fails with a readable error instead.
      # Passed through `sudo` explicitly: sudo resets the environment, so exporting these
      # as plain job env would not reach apt.
      APT: "DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a NEEDRESTART_SUSPEND=1 apt-get -o DPkg::Lock::Timeout=180"
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # spkbak and txtfnd are multi-targeted; off Windows only their net10.0 TFM can
      # build. txtfnd references the Windows-only shared.win for its Windows TFM, so
      # EnableWindowsTargeting lets the net10.0 build resolve the graph without
      # building shared.win.
      - name: Build cross-platform tools
        run: |
          for p in cnvrtr audcap vidcap outcap inpctl scrcap imgfnd llmctl uiactl stpcap; do
            dotnet build "src/$p/$p.csproj" -c Release
          done
          dotnet build src/spkbak/spkbak.csproj -c Release -f net10.0
          dotnet build src/txtfnd/txtfnd.csproj -c Release -f net10.0 -p:EnableWindowsTargeting=true
          dotnet build src/waitfr/waitfr.csproj -c Release -f net10.0 -p:EnableWindowsTargeting=true
          dotnet build src/playbk/playbk.csproj -c Release -f net10.0 -p:EnableWindowsTargeting=true

      - name: Test (cross-platform, excluding hardware-dependent)
        run: |
          for t in cnvrtr spkbak inpctl scrcap imgfnd llmctl uiactl stpcap shared; do
            dotnet test "src/$t.Tests/$t.Tests.csproj" -c Release \
              --filter "FullyQualifiedName!~IntegrationTests"
          done

      # Real X11 smoke test on Linux: drive an xterm with inpctl, capture with scrcap,
      # OCR-locate text with txtfnd — all under a headless Xvfb. macOS has no X11.
      - name: Linux X11 end-to-end (inpctl + scrcap + txtfnd)
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 15
        run: |
          sudo apt-get update -qq
          sudo $APT install -y -qq xdotool imagemagick xvfb openbox xterm wmctrl tesseract-ocr
          bash scripts/linux-e2e.sh

      # AT-SPI accessibility e2e for uiactl (drives gnome-calculator). Self-skips if
      # the a11y stack is unavailable. Linux only.
      - name: Linux AT-SPI end-to-end (uiactl)
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 15
        run: |
          sudo $APT install -y -qq at-spi2-core python3-pyatspi dbus-x11 gnome-calculator
          bash scripts/linux-uiactl-e2e.sh

      # XRecord input-recording e2e for stpcap (P/Invoke to libXtst — no Python). Linux only.
      - name: Linux XRecord end-to-end (stpcap)
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 15
        run: bash scripts/linux-stpcap-e2e.sh

      # Full-stack e2e: the playbk orchestrator running a real playbook on Linux.
      - name: Linux end-to-end (playbk orchestrator)
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 15
        run: bash scripts/linux-playbk-e2e.sh

      # One self-contained binary per tool (PublishSingleFile), so the bundle is a folder
      # of runnable executables rather than hundreds of loose DLLs.
      - name: Publish downloadable binaries
        run: |
          set -euo pipefail
          SF="-p:PublishSingleFile=true -p:DebugType=none"
          for p in cnvrtr audcap vidcap outcap inpctl scrcap imgfnd llmctl uiactl stpcap; do
            dotnet publish "src/$p/$p.csproj" -c Release -r ${{ matrix.rid }} $SF -o "staged/$p"
          done
          dotnet publish src/spkbak/spkbak.csproj -c Release -f net10.0 -r ${{ matrix.rid }} $SF -o staged/spkbak
          dotnet publish src/txtfnd/txtfnd.csproj -c Release -f net10.0 -r ${{ matrix.rid }} $SF -p:EnableWindowsTargeting=true -o staged/txtfnd
          dotnet publish src/waitfr/waitfr.csproj -c Release -f net10.0 -r ${{ matrix.rid }} $SF -p:EnableWindowsTargeting=true -o staged/waitfr
          dotnet publish src/playbk/playbk.csproj -c Release -f net10.0 -r ${{ matrix.rid }} $SF -p:EnableWindowsTargeting=true -o staged/playbk
          # Flatten to ONE directory of purpose-named executables. Each tool is published
          # into its own staging dir first, then only its own binary is taken forward — the
          # staging dirs also contain bare apphosts for ProjectReferenced tools (outcap
          # carries audcap/vidcap, playbk carries most of them) which are dead weight now
          # that each tool is a single file, and would shadow the real binaries.
          #
          # Flat is also what makes playbk work: it prepends its own directory to PATH
          # (Program.cs) and shells out by bare name, so one directory means no duplicated
          # copy of every tool inside playbk's own folder.
          mkdir -p bundle
          for d in staged/*/; do
            t="$(basename "$d")"
            [ -f "$d$t" ] && cp -f "$d$t" bundle/
            # LLamaSharp's native libraries are the one unavoidable extra.
            [ -d "${d}runtimes" ] && cp -rf "${d}runtimes" bundle/ || true
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: idleops-${{ matrix.rid }}
          path: bundle/

  # Rolling `latest-main` release: every green push to main republishes the per-platform
  # bundles, so there is always a current download without cutting a version. Gated on
  # both build jobs, so a broken commit leaves the previous assets in place.
  release:
    name: Refresh latest-main release
    needs: [windows, crossplatform]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Each artifact lands in its own dist/idleops-<rid>/ directory.
      - name: Download the built bundles
        uses: actions/download-artifact@v8
        with:
          pattern: idleops-*
          path: dist

      - name: Package one archive per platform
        run: |
          set -euo pipefail
          mkdir -p out
          cd dist
          for d in idleops-*; do
            [ -d "$d" ] || continue
            case "$d" in
              # tar.gz on Unix keeps the executable bit on the apphost binaries; zip drops
              # it, which would leave the downloaded tools unrunnable without a chmod.
              *win-x64) (cd "$d" && zip -qr "../../out/$d.zip" .) ;;
              *)        tar -czf "../out/$d.tar.gz" -C "$d" . ;;
            esac
          done
          ls -la ../out

      # Deleted and recreated rather than updated in place: action-gh-release will
      # happily refresh an existing release, but it does NOT move the git tag to the
      # new commit — so `latest-main` would keep pointing at whatever commit first
      # created it. Same approach as TWANGA and POSEIDON. Idempotent on a fresh repo.
      - name: Delete previous latest-main release + tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest-main --yes --cleanup-tag --repo "${{ github.repository }}" || true

      - name: Publish rolling latest-main release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest-main
          name: "Latest main build"
          # prerelease + make_latest:false keep this off the "Latest release" badge, so
          # a future v* tag owns that instead of a rolling dev build.
          prerelease: true
          make_latest: "false"
          draft: false
          target_commitish: ${{ github.sha }}
          files: out/*
          body: |
            Auto-built from `main` at `${{ github.sha }}` — refreshed on every green push, so these
            assets always match the newest commit.

            | Asset | Contents |
            |---|---|
            | `idleops-win-x64.zip` | every tool, including the Windows-only ones |
            | `idleops-linux-x64.tar.gz` | the cross-platform tools (X11) |
            | `idleops-osx-arm64.tar.gz` | the cross-platform tools (Apple silicon) |

            Framework-dependent builds: they need the [.NET 10 runtime](https://dotnet.microsoft.com/download).
            See [setup](https://github.com/${{ github.repository }}/blob/main/docs/setup.md) for the
            per-platform prerequisites (ffmpeg everywhere; xdotool/ImageMagick/Tesseract on Linux;
            cliclick/Tesseract plus Accessibility and Screen Recording permission on macOS).
