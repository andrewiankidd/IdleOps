# yaml-language-server: $schema=https://raw.githubusercontent.com/andrewiankidd/IdleOps/main/schema/idleops.schema.json
# notepad-hello-world — launch Notepad, type text, record, close
#
# Usage:
#   src/playbk/bin/Debug/net10.0/playbk.exe -i src/playbk/inputs/notepad-hello-world.idleops.yaml -o ./outputs

steps:
  - id: notepad
    name: Launch Notepad
    action: exec
    args: notepad.exe
    wait: false

  - name: Wait for Notepad window
    action: wait-window
    window: "*Notepad*"
    timeout: 10

  - id: record
    name: Start recording
    action: exec
    args: outcap.exe --window "*Notepad*" --timer 15
    wait: false

  - name: Let recording start
    action: sleep
    args: "1"

  - name: Type hello world
    action: exec
    args: inpctl.exe --window "*Notepad*" --type "hello world!"
    wait: true

  - name: Pause to show result
    action: sleep
    args: "2"

  - name: Close Notepad
    action: exec
    args: inpctl.exe --window "*Notepad*" --keyboard "ALT+F4"
    wait: true

  - name: Wait for save prompt
    action: sleep
    args: "1"

  - name: Dismiss save prompt
    action: click-text
    window: "*Notepad*"
    text: "Don"

  - name: Wait for Notepad to close
    action: sleep
    args: "2"

  - name: Stop recording
    action: exec
    args: inpctl.exe --pid %record_pid% --ctrlc
    wait: true
